[package]
name = "leviathan-indexer"
edition = "2021"
version.workspace = true

[lib]
name = "leviathan_indexer"

[[bin]]
name = "leviathan-indexer"
path = "src/bin/indexer.rs"
required-features = ["live"]

[features]
live = [
  "dep:tokio",
  "dep:anyhow",
  "dep:clap",
  "dep:solana-sdk",
  "dep:solana_toolbox_endpoint",
  "dep:anchor-lang",
  "dep:anchor-spl",
  "leviathan-telemetry/server",
]

[dependencies]
bs58 = "0.5"
serde = { workspace = true }
serde_json.workspace = true
prometheus-client = "0.26"
leviathan-telemetry = { path = "../leviathan-telemetry" }
psyche-core.workspace = true
psyche-coordinator.workspace = true
psyche-solana-coordinator = { workspace = true, features = ["no-entrypoint"] }
psyche-solana-treasurer = { workspace = true, features = ["no-entrypoint"] }

tokio = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
clap = { workspace = true, optional = true }
solana-sdk = { version = "=2.1.4", optional = true }
solana_toolbox_endpoint = { version = "=0.4.4-solana-2.1.4", optional = true }
anchor-lang = { workspace = true, optional = true }
anchor-spl = { workspace = true, optional = true }

[dev-dependencies]
bytemuck = { workspace = true }
anchor-lang = { workspace = true }
