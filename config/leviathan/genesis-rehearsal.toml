[config]
warmup_time = 20
# A fraud in an epoch's final round has the round's witness phase and the
# cooldown to be convicted (wienerlabs/leviathan-net#40). Sized from a
# measurement: a verifier daemon polling every 8 seconds needs up to the
# interval plus two passes, and building the replay and judging this model's
# step took at most 0.265 s on an M1 Pro CPU, a lower bound that leaves out
# the vote's confirmation (docs/FIRST_RUN.md section 3). A 25 s window covers
# twice that latency for a pass of up to 2.25 s; LeviathanAuditWindowTooShort
# fires when it does not.
cooldown_time = 20
epoch_time = 90
max_round_train_time = 30
round_witness_time = 5
min_clients = 2
init_min_clients = 2
verification_percent = 10
witness_nodes = 1
global_batch_size_start = 8
global_batch_size_end = 8
global_batch_size_warmup_tokens = 0
total_steps = 25000
waiting_for_members_extra_time = 3

[model.LLM]
architecture = "HfLlama"
data_type = "Pretraining"
max_seq_len = 64
cold_start_warmup_steps = 0

[model.LLM.checkpoint.Hub]
repo_id = "pefontana/Nano-Llama"
revision = "cf48eac4944f6e954a3d9c9c30e8c865e64e7d03"

[model.LLM.data_location.Http]
token_size_in_bytes = "TwoBytes"
shuffle = "DontShuffle"

[model.LLM.data_location.Http.location]
SingleUrl = "https://huggingface.co/pefontana/Nano-Llama/resolve/main/tiny-ci-dataset/000_tiny-test.ds"

[model.LLM.lr_schedule.Cosine]
base_lr = 4.0e-4
warmup_steps = 250
warmup_init_lr = 0.0
total_steps = 25000
final_lr = 4.0e-5

[model.LLM.optimizer.Distro]
clip_grad_norm = 1.0
compression_decay = 0.999
compression_chunk = 64
compression_topk = 8
quantize_1bit = true
# Every node combines its peers' results robustly, by the run's rule rather
# than its own (wienerlabs/leviathan-net#60).
robust_aggregation = true
