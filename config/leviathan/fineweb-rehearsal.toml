[config]
warmup_time = 20
cooldown_time = 5
epoch_time = 90
max_round_train_time = 30
round_witness_time = 5
min_clients = 2
init_min_clients = 2
verification_percent = 10
witness_nodes = 1
global_batch_size_start = 8
global_batch_size_end = 8
global_batch_size_warmup_tokens = 0
total_steps = 25000
waiting_for_members_extra_time = 3

[model.LLM]
architecture = "HfLlama"
data_type = "Pretraining"
max_seq_len = 512
cold_start_warmup_steps = 0

[model.LLM.checkpoint.Hub]
repo_id = "emozilla/llama2-20m-init"
revision = "e10c23f4b5245032174cfc03d20ef7b6d9f836f2"

[model.LLM.data_location.Http]
token_size_in_bytes = "TwoBytes"
shuffle = "DontShuffle"

[model.LLM.data_location.Http.location]
SingleUrl = "https://huggingface.co/datasets/emozilla/fineweb-10bt-tokenized-datatrove-llama2/resolve/cd477aed05fd5c2efd4b0c6c2459f1537fbd1a30/00000_00000_shuffled.ds"

[model.LLM.lr_schedule.Cosine]
base_lr = 4.0e-4
warmup_steps = 250
warmup_init_lr = 0.0
total_steps = 25000
final_lr = 4.0e-5

[model.LLM.optimizer.Distro]
clip_grad_norm = 1.0
compression_decay = 0.999
compression_chunk = 64
compression_topk = 8
quantize_1bit = true
