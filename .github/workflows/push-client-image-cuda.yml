name: Push CUDA Client Image

# Builds docker/Dockerfile.client-cuda and publishes it to this org's GHCR.
#
# This exists because the nix image cannot be produced in a GitHub runner: its
# closure includes CUDA built from source, which no public cache carries, and the
# attempt ran past the six hour job ceiling with thousands of derivations still
# to go. This image takes CUDA from NVIDIA's base image instead, so it builds
# here in well under that.

on:
  push:
    branches:
      - main
    paths:
      - 'docker/Dockerfile.client-cuda'
      - 'docker/leviathan_client_entrypoint.sh'
      - '.github/workflows/push-client-image-cuda.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'architectures/**'
      - 'shared/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.client-cuda
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/leviathan-client:latest
            ghcr.io/${{ github.repository_owner }}/leviathan-client:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
