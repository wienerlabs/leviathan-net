name: Leviathan substrate

on:
  push:
    paths:
      - "shared/verifier/**"
      - "shared/coordinator/**"
      - "tools/rust-tools/leviathan-indexer/**"
      - "tools/rust-tools/leviathan-verifier/**"
      - "architectures/decentralized/solana-treasurer/**"
      - "architectures/decentralized/solana-coordinator/**"
      - "architectures/decentralized/solana-authorizer/**"
      - "architectures/decentralized/solana-tooling/**"
      - "shared/core/**"
      - "shared/modeling/**"
      - "shared/network/**"
      - "shared/client/**"
      - "shared/data-provider/**"
      - "config/leviathan/**"
      - "config/error-feedback-fidelity/**"
      - "scripts/replay-smoke.sh"
      - "scripts/error-feedback-fidelity.sh"
      - "architectures/centralized/**"
      - "tools/rust-tools/leviathan-telemetry/**"
      - "telemetry/**"
      - ".github/workflows/leviathan-substrate.yml"
  pull_request:
    paths:
      - "shared/verifier/**"
      - "shared/coordinator/**"
      - "tools/rust-tools/leviathan-indexer/**"
      - "tools/rust-tools/leviathan-verifier/**"
      - "architectures/decentralized/solana-treasurer/**"
      - "architectures/decentralized/solana-coordinator/**"
      - "architectures/decentralized/solana-authorizer/**"
      - "architectures/decentralized/solana-tooling/**"
      - "shared/core/**"
      - "shared/modeling/**"
      - "shared/network/**"
      - "shared/client/**"
      - "shared/data-provider/**"
      - "config/leviathan/**"
      - "config/error-feedback-fidelity/**"
      - "scripts/replay-smoke.sh"
      - "scripts/error-feedback-fidelity.sh"
      - "architectures/centralized/**"
      - "tools/rust-tools/leviathan-telemetry/**"
      - "telemetry/**"
      - ".github/workflows/leviathan-substrate.yml"

concurrency:
  group: leviathan-substrate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  substrate:
    name: security core + memnet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leviathan-substrate

      - name: Formatting
        run: >
          cargo fmt --check
          -p psyche-verifier
          -p leviathan-indexer
          -p leviathan-telemetry

      # The indexer's chain reader and its exporter, and the telemetry
      # endpoint, are behind features; test them too (wienerlabs/leviathan-net#57).
      - name: Security core, aggregation and telemetry
        run: >
          cargo test --locked
          -p psyche-verifier
          -p psyche-coordinator
          -p leviathan-indexer
          -p leviathan-telemetry
          --features leviathan-indexer/live,leviathan-telemetry/server

      - name: Solana programs in-process (memnet)
        run: cargo test --locked -p psyche-solana-tooling

  # The kill-switch rules Prometheus loads: they parse, the scrape config that
  # loads them parses, and every alert fires on the series it is written for
  # and stays quiet on the rest (wienerlabs/leviathan-net#57).
  rules:
    name: kill-switch rules (promtool)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS_IMAGE: prom/prometheus:v3.5.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: The rules and the scrape config parse
        run: |
          docker run --rm \
            -v "$PWD/telemetry/prometheus.yml:/etc/prometheus/prometheus.yml:ro" \
            -v "$PWD/telemetry/leviathan-killswitch.rules.yml:/etc/prometheus/leviathan-killswitch.rules.yml:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" \
            check config /etc/prometheus/prometheus.yml

      - name: Every alert fires when it should and only then
        run: |
          docker run --rm -v "$PWD/telemetry:/telemetry:ro" \
            --entrypoint promtool "$PROMETHEUS_IMAGE" \
            test rules /telemetry/tests/leviathan-killswitch.test.yml

  # The crates that link libtorch: the model, the payload encoding, the client
  # that keeps peers' payloads, the replay verifier and the daemon that
  # convicts on it. None of them built in any gate before, which is how the
  # daemon suites came to overflow their stack unseen
  # (wienerlabs/leviathan-net#35).
  libtorch:
    name: libtorch suites (model, verifier, daemon)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIBTORCH_USE_PYTORCH: "1"
      LIBTORCH_BYPASS_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          large-packages: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU torch, the version tch is built against
        run: |
          pip install --quiet torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          TORCH_LIB=$(python -c "import os, torch; print(os.path.join(os.path.dirname(torch.__file__), 'lib'))")
          PYTHON_LIB=$(python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
          echo "LD_LIBRARY_PATH=$TORCH_LIB:$PYTHON_LIB:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$PYTHON_LIB:${LIBRARY_PATH:-}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: leviathan-libtorch

      - name: Model and DisTrO
        run: cargo test --locked -p psyche-modeling

      - name: Payload encoding and commitments
        run: cargo test --locked -p psyche-network

      - name: The client keeps peers' payloads with what they signed
        run: cargo test --locked -p psyche-client --lib

      - name: Replay verifier
        run: cargo test --locked -p leviathan-verifier

      # The other memnet suites run in the job above; these are the ones
      # that need libtorch.
      - name: Verifier daemon on the real programs (memnet), default stack
        run: cargo test --locked -p psyche-solana-tooling --features daemon --test mod verifier_daemon

      - name: Replay smoke, honest cleared and forged convicted
        run: |
          cargo build --locked -p leviathan-verifier --bins
          bash scripts/replay-smoke.sh

      # The error-feedback measurement of wienerlabs/leviathan-net#48 has to
      # train a run the way the client does: two real clients train a short
      # run, and the simulation has to send each of their payloads byte for
      # byte. The same clients keep the state each round trains from, and
      # have to keep and serve the one each payload commits to
      # (wienerlabs/leviathan-net#89).
      - name: Error-feedback simulation and kept states against real clients
        run: |
          cargo build --locked --bin psyche-centralized-server --bin psyche-centralized-client --bin check-error-feedback-fidelity --bin check-round-states
          bash scripts/error-feedback-fidelity.sh
