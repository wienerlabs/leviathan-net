[workspace]
members = ["leviathan-multitude", "leviathan-multitude-sim"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
leviathan-multitude = { path = "./leviathan-multitude" }
psyche-verifier = { path = "../../shared/verifier" }
candle-core = "0.11"
candle-nn = "0.11"
bs58 = "0.5"
ed25519-dalek = "2"
postcard = { version = "1.0.10", features = ["use-std"] }
serde = { version = "1.0.209", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
thiserror = "2.0.3"
anyhow = "1.0.86"
clap = { version = "4.5.16", features = ["derive"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
