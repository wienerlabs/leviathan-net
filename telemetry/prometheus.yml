global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']
    scrape_interval: 10s
    metrics_path: /metrics

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # The kill-switch rules read these two. Start them on the host:
  #   leviathan-indexer --run-id <run> --metrics-listen 0.0.0.0:9464
  #   leviathan-verifier-daemon ... --metrics-listen 0.0.0.0:9465
  # A target that cannot be scraped is an alert of its own
  # (LeviathanIndexerDown, LeviathanVerifierDown).
  - job_name: 'leviathan-indexer'
    static_configs:
      - targets: ['host.docker.internal:9464']

  - job_name: 'leviathan-verifier'
    static_configs:
      - targets: ['host.docker.internal:9465']

otlp:
  keep_identifying_resource_attributes: true

rule_files:
  - /etc/prometheus/leviathan-killswitch.rules.yml
